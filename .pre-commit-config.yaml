repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.13
    hooks:
      - id: ruff
        args: [--config, packages/core/pyproject.toml, --fix]
        files: ^(apps/api|packages/core)/
      - id: ruff-format
        args: [--config, packages/core/pyproject.toml]
        files: ^(apps/api|packages/core)/

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        files: ^apps/web/
        additional_dependencies:
          - prettier@3.9.5
