[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tracker-core"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "sqlalchemy>=2.0",
  "asyncpg>=0.29",
  "greenlet>=3.0",
  "pydantic[email]>=2.6",
  "pydantic-settings>=2.2",
  "bcrypt>=4.1",
  "python-jose[cryptography]>=3.3",
  "click>=8.1",
  "alembic>=1.13",
  "structlog>=24",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["tracker_core*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 120
fix = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # pyflakes
  "I",    # isort
  "B",    # bugbear
  "UP",   # pyupgrade
  "SIM",  # simplify
  "RUF",  # Ruff-specific
  "C4",   # comprehensions
  "PIE",  # misc improvements
  "PERF", # performance
]
ignore = [
  "E501",   # line length handled by formatter / readability judgment
  "SIM102", # nested ifs can be clearer
  "B008",   # FastAPI Depends() in function defaults
]

extend-unsafe-fixes = []

[tool.ruff.lint.per-file-ignores]
"**/tests/**/*.py" = ["B"]  # bugbear noisy in test fixtures
"**/alembic/**" = ["ALL"]
